services:
  - type: web
    name: tiktok-video-worker
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    dockerfilePath: ./video-worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WEB_ORIGIN
        value: https://tiktok-downloader-pro-alpha.vercel.app
      - key: MAX_SOURCE_BYTES
        value: "83886080"
      - key: MAX_DURATION_SECONDS
        value: "180"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
